name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Specific suite to run (leave empty for all)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Smoke gate — fast check that site is up ─────────────────────────
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      site-up: ${{ steps.smoke.outcome == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        id: smoke
        run: npm run test:smoke

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  # ── Stage 2: Core suites — run in parallel after smoke passes ─────────────────
  core-suites:
    name: '${{ matrix.suite }} Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smoke
    if: needs.smoke.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        suite: [navigation, forms, functional, responsive]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── Stage 3: Visual regression — main branch and manual dispatch only ─────────
  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke
    if: |
      needs.smoke.result == 'success' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:visual

      - name: Upload visual diff report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
            __snapshots__/
          retention-days: 30

  # ── Summary job — gate for branch protection rules ────────────────────────────
  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [smoke, core-suites]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.smoke.result }}" != "success" ]]; then
            echo "Smoke tests failed"
            exit 1
          fi
          if [[ "${{ needs.core-suites.result }}" != "success" ]]; then
            echo "Core suite tests failed"
            exit 1
          fi
          echo "All required tests passed"
